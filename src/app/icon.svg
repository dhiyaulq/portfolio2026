<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 32 32">
  <!--
    The mark follows the browser's colour scheme: near-black on a light tab
    strip, white on a dark one. An SVG favicon carries its own stylesheet and
    the media query is evaluated by the browser, so this needs no script and
    no second file. Browsers that don't support SVG favicons ignore the whole
    icon, as they already did.

    The fill is set in CSS rather than as an attribute on purpose — CSS wins
    over a presentation attribute, but only if the attribute isn't on the
    element the rule targets, so keeping it in one place avoids a fill that
    can't be overridden in dark mode.
  -->
  <style>
    path { fill: #191717; }
    @media (prefers-color-scheme: dark) {
      path { fill: #ffffff; }
    }
  </style>
